name: salomon-intra-api

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: salomon-intra-api:server-build
    pull_policy: build
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      MARCACIONES_CENTRAL_TOKEN: ${MARCACIONES_CENTRAL_TOKEN:-}
      MARCACIONES_CENTRAL_ENABLED: ${MARCACIONES_CENTRAL_ENABLED:-false}
      DB_HOST: aleph-postgres
      DB_PORT: "5432"
      DB_USERNAME: salomon_intra_app
      DB_POOL_MAX_SIZE: "5"
      INTRA_SA_INITIAL_PASSWORD: ${INTRA_SA_INITIAL_PASSWORD:-}
      SALOMON_DEVICE_ADMIN_KEY: ${SALOMON_DEVICE_ADMIN_KEY:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    secrets:
      - source: intra_db_password
        target: DB_PASSWORD
    expose:
      - "8080"
    networks:
      database:
        aliases:
          - salomon-intra-api
      application:
        aliases:
          - salomon-intra-api
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 200
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  public-status:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "13121:8080"
    networks:
      - application
      - public_status
    configs:
      - source: public_status_nginx
        target: /etc/nginx/conf.d/default.conf

  migrate:
    image: salomon-intra-api:server-build
    pull_policy: never
    healthcheck:
      disable: true
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: migrate
      DB_HOST: aleph-postgres
      DB_PORT: "5432"
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    secrets:
      - source: migration_password
        target: DB_MIGRATION_PASSWORD
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.5

networks:
  public_status:
  application:
    name: salomon-intra_application
    internal: true
  database:
    external: true
    name: aleph_network

configs:
  public_status_nginx:
    content: |
      limit_req_zone $$binary_remote_addr zone=adms_requests:10m rate=8r/s;
      server {
        listen 8080;
        server_name _;
        location = /api/v1/status {
          limit_except GET { deny all; }
          proxy_pass_request_headers off;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_pass http://api:8080/api/v1/status;
        }
        location ^~ /iclock/ {
          limit_req zone=adms_requests burst=16 nodelay;
          client_max_body_size 1m;
          proxy_pass http://api:8080;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header X-Real-IP $$remote_addr;
        }
        location / { return 404; }
      }

secrets:
  migration_password:
    file: ${INTRA_MIGRATION_PASSWORD_FILE:?Set an absolute VPS secret-file path}
  intra_db_password:
    file: ${INTRA_DB_PASSWORD_FILE:?Set an absolute VPS secret-file path}
